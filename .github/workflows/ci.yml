name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # System Python, because the timing check drives LibreOffice through python3-uno.
      - name: Install LibreOffice and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno python3-pip
          python3 -m pip install --break-system-packages -r requirements-dev.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build workbooks
        run: |
          mkdir -p dist
          python3 scripts/build_planner.py dist/Project_Planner.xlsx --baselined --recalc
          python3 scripts/build_planner.py dist/Project_Planner_Blank.xlsx --blank --recalc
          python3 scripts/build_planner.py dist/Project_Planner_Simple.xlsx --baselined --simple --recalc
          python3 scripts/build_planner.py dist/Stress_1000_tasks.xlsx --tasks 1000 --stress 33
          python3 scripts/build_planner.py dist/Release_Planner.xlsx --release --baselined --recalc
          python3 scripts/build_planner.py dist/Release_Stress_1000_tasks.xlsx --release --tasks 1000 --stress 33
          python3 scripts/build_planner.py dist/Release11_Planner.xlsx --release 1.1 --baselined --recalc
          python3 scripts/build_planner.py dist/Release11_Stress_1000_tasks.xlsx --release 1.1 --tasks 1000 --stress 33

      - name: Performance check (sample)
        run: python3 scripts/perf_check.py dist/Project_Planner.xlsx --profile sample --timing

      - name: Performance check (1,000-task stress workbook)
        run: python3 scripts/perf_check.py dist/Stress_1000_tasks.xlsx --profile stress --timing

      - name: Performance check (Release 1.0 sample and 1,000-task stress workbook)
        run: |
          python3 scripts/perf_check.py dist/Release_Planner.xlsx --profile sample --timing
          python3 scripts/perf_check.py dist/Release_Stress_1000_tasks.xlsx --profile stress --timing
          python3 scripts/perf_check.py dist/Release11_Planner.xlsx --profile sample --timing
          python3 scripts/perf_check.py dist/Release11_Stress_1000_tasks.xlsx --profile stress --timing

      - name: Structure check (Microsoft 365 edition; LibreOffice can't time LAMBDA / FILTER)
        run: |
          python3 scripts/build_planner.py dist/M365_Planner.xlsx --release m365 --baselined
          python3 scripts/perf_check.py dist/M365_Planner.xlsx --profile sample

      - name: Release 1.0 checklist
        run: |
          python3 scripts/release_check.py
          python3 scripts/release_check.py --edition 1.1

      # docs/export.html in headless Chromium, with Pyodide from its GitHub release instead of the CDN
      - name: Browser export page
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          curl -sSL -o /tmp/pyodide.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-core-0.26.4.tar.bz2
          tar xjf /tmp/pyodide.tar.bz2 -C /tmp
          PYODIDE_DIR=/tmp/pyodide python3 -m unittest tests.test_mspdi.ExportPageTest -v

      - name: Export the sample to MS Project XML
        run: python3 scripts/export_mspdi.py dist/Project_Planner.xlsx dist/Project_Planner.xml

      - uses: actions/upload-artifact@v4
        with:
          name: workbooks
          path: |
            dist/Project_Planner.xlsx
            dist/Project_Planner_Blank.xlsx
            dist/Project_Planner.xml
